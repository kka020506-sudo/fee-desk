<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fee Desk - Regular to Direct switch advice</title>
<style>
:root{
  --ink:#1c1917; --ink2:#57534e; --ink3:#6b645e; --rule:#e7e5e4; --band:#f7f5f2; --white:#ffffff;
  --em:#0e9f6e; --em-ink:#047857; --em-soft:#d9f2e8; --vi:#7c4dbd; --vi-ink:#6b3fa8; --vi-soft:#ece4f7;
  --sans:"Avenir Next","Avenir","Segoe UI Variable Display","Segoe UI","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--ink);font:15.5px/1.55 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 32px}
/* top bar */
.bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;gap:18px;height:62px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.bar button,.demo,.bar label{white-space:nowrap}
.logo i{width:14px;height:14px;border-radius:50%;background:var(--em);display:inline-block;box-shadow:6px 0 0 -2px var(--vi)}
.bar .tag{color:var(--ink3);font-size:13px;border-left:1px solid var(--rule);padding-left:16px;white-space:nowrap}
@media(max-width:1320px){.bar .tag{display:none}}
@media(max-width:760px){.demo,.bar label,.bar .sp{display:none} .bar .wrap{gap:8px;flex-wrap:wrap;height:auto;padding-top:8px;padding-bottom:8px} select{max-width:100%;flex:1;min-width:0} #print{display:none}
  .wrap{padding:0 16px} .tabs{top:0;position:relative} code{word-break:break-all} h1{font-size:26px} .figs div{border-right:0}}
.tscroll{overflow-x:auto}
.bar .sp{flex:1}
select{font:inherit;font-size:14.5px;color:var(--ink);background:var(--white);border:1.5px solid var(--ink);border-radius:999px;padding:7px 34px 7px 14px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;max-width:300px}
button{font:inherit;font-size:14px;font-weight:600;border-radius:999px;padding:8px 18px;cursor:pointer;border:1.5px solid var(--ink);background:var(--ink);color:#fff}
button.ghost{background:transparent;color:var(--ink)}
button:hover{opacity:.88} :focus-visible{outline:3px solid var(--em);outline-offset:2px}
.demo{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--vi-ink);background:var(--vi-soft);padding:3px 9px;border-radius:999px}
/* tabs: a segmented step control under the bar */
.tabs{background:var(--white);border-bottom:1px solid var(--rule);position:sticky;top:62px;z-index:4}
.tabs .wrap{display:flex;gap:4px;padding-top:10px;padding-bottom:10px;overflow-x:auto}
.tabs button{background:transparent;color:var(--ink2);border:1.5px solid transparent;font-weight:600;padding:7px 16px 7px 8px;display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.tabs button .k{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink3);font-size:12px;color:var(--ink2)}
.tabs button.on{border-color:var(--ink);color:var(--ink)} .tabs button.on .k{background:var(--em);border-color:var(--em);color:#fff}
.tabs button:hover{opacity:1;color:var(--ink)}
.panel{display:none} .panel.on{display:block}
/* sections */
section.band{background:var(--band);padding:44px 0 40px;border-bottom:1px solid var(--rule)}
section.plain{padding:44px 0 30px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
h1{font-size:38px;line-height:1.15;letter-spacing:-.02em;margin:0 0 12px;font-weight:700;max-width:860px}
h1 .em{color:var(--em-ink)} h1 .vi{color:var(--vi-ink)}
h2{font-size:22px;letter-spacing:-.01em;margin:38px 0 6px;font-weight:700}
.sub{color:var(--ink2);font-size:16px;max-width:760px;margin:0 0 22px}
.figs{display:flex;flex-wrap:wrap;gap:0;margin:20px 0 6px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.figs div{padding:14px 26px 14px 0;margin-right:26px;border-right:1px solid var(--rule)} .figs div:last-child{border-right:0}
.figs b{display:block;font-size:24px;letter-spacing:-.01em} .figs span{font-size:12.5px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:34px 44px;margin-top:14px} .grid .full{grid-column:1/-1}
@media(max-width:900px){.grid{grid-template-columns:1fr}.bar .tag{display:none}h1{font-size:30px}}
figure{margin:0} figcaption{margin:0 0 8px}
figcaption .n{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);display:block}
figcaption .t{font-size:16.5px;font-weight:700;display:block;margin-top:2px}
figcaption .d{font-size:13.5px;color:var(--ink2);display:block;margin-top:2px}
.key{display:flex;gap:16px;font-size:12.5px;color:var(--ink2);margin:4px 0 6px;flex-wrap:wrap}
.key span{display:inline-flex;align-items:center;gap:6px} .key i{width:10px;height:10px;border-radius:50%;display:inline-block}
.queue{list-style:none;margin:0;padding:0;counter-reset:q}
.queue li{display:grid;grid-template-columns:30px 1fr auto;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.queue li:hover .c{color:var(--em-ink);text-decoration:underline}
.queue .r{font-size:12.5px;color:var(--ink3)} .queue .c{font-weight:600} .queue .s{font-size:12.5px;color:var(--ink2);margin-left:6px;font-weight:400}
.queue .v{font-weight:600}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
th{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:8px 10px 8px 0;border-bottom:2px solid var(--ink)}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--rule);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap} tr.tot td{border-bottom:0;border-top:2px solid var(--ink);font-weight:700}
.act{font-size:13.5px;line-height:1.45;color:var(--ink);max-width:300px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;border:1.5px solid var(--ink);white-space:nowrap}
.pill.part{border-style:dashed}
.sched p{font-size:13px;color:var(--ink2);margin:4px 0;line-height:1.55} .sched b{color:var(--ink)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:6px} @media(max-width:900px){.cols{grid-template-columns:1fr}}
ul.l{margin:6px 0;padding-left:18px} ul.l li{margin:5px 0;font-size:14.5px}
.check{border:2px solid var(--ink);padding:16px 20px;margin-top:30px}
.check h3{margin:0 0 8px;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase}
.check li{list-style:none;margin:6px 0 6px -18px;font-size:14.5px} .check li:before{content:"";display:inline-block;width:13px;height:13px;border:1.6px solid var(--ink);margin-right:11px;vertical-align:-2px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:44px;margin-top:40px;font-size:13px;color:var(--ink2)} .sign div{border-top:1px solid var(--ink);padding-top:5px}
footer{background:var(--band);border-top:1px solid var(--rule);padding:26px 0 36px;font-size:13.5px;color:var(--ink2)}
footer .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px}
.msg{white-space:pre-wrap;margin-top:12px;padding:10px 14px;background:var(--white);border-left:4px solid var(--em);color:var(--ink);font-size:13.5px}
.msg.bad{border-left-color:var(--vi)}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--sans)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:7px 10px;border-radius:6px;display:none;z-index:9;max-width:300px;line-height:1.4}
.nothing{font-size:20px;margin:10px 0 0}
@media print{
  .bar,.tabs,#p-book,footer,.noprint,.tip{display:none!important}
  #p-advice,#p-charts,#p-schedule{display:block!important} #p-charts,#p-schedule{break-before:page}
  section.plain{padding:0} .wrap{padding:0;max-width:none}
  body{font-size:12px} h1{font-size:22px} h2{font-size:16px;margin-top:18px;break-after:avoid} figure,tr,.check{break-inside:avoid}
  .sub{font-size:12.5px;margin-bottom:10px} .figs b{font-size:17px} .figs div{padding:8px 16px 8px 0;margin-right:16px}
  .grid{grid-template-columns:1fr 1fr!important;gap:14px 22px;margin-top:8px} .grid .full{grid-column:1/-1}
  figure svg{max-height:200px} .grid .full svg{max-height:170px}
  figcaption .t{font-size:12.5px} figcaption .d{font-size:10.5px} .key{font-size:10px;margin:2px 0}
  table{font-size:11px} td{padding:6px 8px 6px 0} .act{font-size:10.5px;max-width:none}
  .cols{grid-template-columns:1fr 1fr!important;gap:22px} ul.l li{font-size:11.5px} .check{margin-top:14px;padding:10px 14px} .check li{font-size:11.5px}
  .sched p{font-size:10px} .sign{margin-top:24px}
  @page{size:A4;margin:14mm}
}
</style>

<body>
<div class="bar"><div class="wrap">
  <div class="logo"><i></i>Fee Desk</div>
  <div class="tag">Switch advice &middot; Krishna Valley Wealth Advisors (fictional)</div>
  <div class="sp"></div>
  <span class="demo" id="stamp">Demonstration data</span>
  <label for="who" class="noprint" style="font-size:13px;color:var(--ink2)">Client</label><select id="who"></select>
  <button id="print" type="button">Print note</button>
</div></div>

<nav class="tabs" role="tablist" aria-label="Sections"><div class="wrap">
  <button role="tab" data-t="book" type="button"><span class="k">1</span>The book</button>
  <button role="tab" data-t="advice" type="button"><span class="k">2</span>Advice note</button>
  <button role="tab" data-t="charts" type="button"><span class="k">3</span>Charts</button>
  <button role="tab" data-t="schedule" type="button"><span class="k">4</span>Release schedule</button>
</div></nav>
<section class="band panel" id="p-book" role="tabpanel"><div class="wrap" id="book"></div></section>
<section class="plain panel" id="p-advice" role="tabpanel"><div class="wrap" id="note"></div></section>
<section class="plain panel" id="p-charts" role="tabpanel"><div class="wrap" id="charts"></div></section>
<section class="plain panel" id="p-schedule" role="tabpanel"><div class="wrap" id="sched"></div></section>
<footer><div class="wrap" id="prov"></div></footer>
<div class="tip" id="tip"></div>
<script>
/* Rule engine - JavaScript implementation (runs inside the dashboard).
   Written separately from engine.py, from the same written definitions.
   verify.py runs both on the same data and diffs every field.
   Exposes FundEngine.run(schemes, monthly, clients, txns) and FundEngine.whatif(...). */
(function (root) {
  "use strict";
  var T = {
    FEE_FLAG_BPS: 25, EARNING_PP: 1.0, SIP_ACTIVE_DAYS: 45, SIP_LAPSE_DAYS: 180,
    DORMANT_DAYS: 180, ASSUMED_GROSS: 0.10, HORIZON_Y: 10
  };
  var ORDER = { OPENING: 0, SIP: 1, LUMPSUM: 1, REDEEM: 2 };

  function rh(x, d) {
    if (x === null || x === undefined) return null;
    d = d || 0;
    var f = Math.pow(10, d);
    return Math.floor(x * f + 0.5) / f;
  }
  // Dates are handled as whole UTC day numbers built from Y-M-D parts.
  function dayNum(iso) {
    var p = iso.split("-");
    return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function isoOf(n) {
    var dt = new Date(n * 86400000);
    return dt.getUTCFullYear() + "-" + pad(dt.getUTCMonth() + 1) + "-" + pad(dt.getUTCDate());
  }
  function monthEndBack(iso, k) {
    var p = iso.split("-"), y = +p[0], m = +p[1] - k;
    while (m <= 0) { m += 12; y -= 1; }
    var last = new Date(Date.UTC(y, m, 0)).getUTCDate();
    return y + "-" + pad(m) + "-" + pad(last);
  }
  function cmp(a, b) { return a < b ? -1 : a > b ? 1 : 0; }

  function run(schemes, monthly, clients, txns) {
    var plans = {}, i;
    schemes.forEach(function (r) { plans[r.plan_id] = r; });
    var NAV = {}, TER = {}, mset = {};
    monthly.forEach(function (r) {
      var key = r.plan_id + "|" + r.month_end;
      NAV[key] = parseFloat(r.nav); TER[key] = parseFloat(r.ter_pct); mset[r.month_end] = 1;
    });
    var count = {};
    monthly.forEach(function (r) { count[r.month_end] = (count[r.month_end] || 0) + 1; });
    var nPlans = Object.keys(plans).length;
    var allMonths = Object.keys(mset).sort();
    var complete = allMonths.filter(function (m) { return count[m] >= nPlans; });
    var val = complete[complete.length - 1], valN = dayNum(val);
    var months = allMonths.filter(function (m) { return m <= val; });
    var m12 = monthEndBack(val, 12), m36 = monthEndBack(val, 36);
    var feeMonths = months.slice(1);
    function g(tab, pid, m) { var v = tab[pid + "|" + m]; return v === undefined ? null : v; }

    // ---------- plans
    var P = {};
    Object.keys(plans).forEach(function (pid) {
      var p = plans[pid];
      var nNow = g(NAV, pid, val), tNow = g(TER, pid, val);
      var n12 = g(NAV, pid, m12), n36 = g(NAV, pid, m36), t12 = g(TER, pid, m12);
      var r1 = (nNow === null || n12 === null) ? null : (nNow / n12 - 1) * 100;
      var c3 = (nNow === null || n36 === null) ? null : (Math.pow(nNow / n36, 1 / 3) - 1) * 100;
      var bps = (tNow === null || t12 === null) ? null : rh((tNow - t12) * 100);
      var flag = bps === null ? null : bps >= T.FEE_FLAG_BPS ? "Fee rise" : bps <= -T.FEE_FLAG_BPS ? "Fee cut" : "Stable";
      P[pid] = { plan_id: pid, scheme_id: p.scheme_id, scheme_name: p.scheme_name, plan: p.plan,
        category: p.category, nav_now: nNow, ter_now: tNow, ter_12m_ago: t12,
        ter_change_bps: bps, fee_flag: flag, _r1: r1, _c3: c3 };
    });
    Object.keys(P).forEach(function (pid) {
      var o = P[pid], p = plans[pid];
      var mine = P[p.scheme_id + "-D"]._c3;
      var comp = p.comparator_scheme_id;
      var cc = comp ? P[comp + "-D"]._c3 : null;
      var verdict, ex = null;
      if (p.passive === "Y") verdict = "Index fund";
      else if (!comp) verdict = "No index comparator";
      else if (mine === null || cc === null) verdict = "Insufficient history";
      else {
        ex = mine - cc;
        verdict = ex >= T.EARNING_PP ? "Earning its fee" : ex >= 0 ? "Marginal" : "Not earning its fee";
      }
      o.ret_1y_pct = rh(o._r1, 2); o.cagr_3y_pct = rh(o._c3, 2);
      o.comparator_scheme_id = comp || null; o.comparator_cagr_3y_pct = rh(cc, 2);
      o.excess_3y_pp = rh(ex, 2); o.fee_verdict = verdict;
    });

    // scheme ranks among Direct plans
    var dps = Object.keys(P).map(function (k) { return P[k]; }).filter(function (o) { return o.plan === "Direct"; });
    Object.keys(P).forEach(function (k) { P[k].rank_cagr_3y_direct = null; P[k].rank_excess_3y = null; });
    dps.filter(function (o) { return o._c3 !== null; })
      .sort(function (a, b) { return (b._c3 - a._c3) || cmp(a.plan_id, b.plan_id); })
      .forEach(function (o, n) { o.rank_cagr_3y_direct = n + 1; });
    dps.filter(function (o) { return o.excess_3y_pp !== null; })
      .map(function (o) { return { o: o, x: o._c3 - P[o.comparator_scheme_id + "-D"]._c3 }; })
      .sort(function (a, b) { return (b.x - a.x) || cmp(a.o.plan_id, b.o.plan_id); })
      .forEach(function (r, n) { r.o.rank_excess_3y = n + 1; });

    // ---------- holdings
    var groups = {};
    txns.forEach(function (t, idx) {
      var k = t.client_id + "|" + t.plan_id;
      (groups[k] = groups[k] || []).push({ i: idx, t: t });
    });
    var keys = Object.keys(groups).sort(function (a, b) {
      var A = a.split("|"), B = b.split("|");
      return cmp(A[0], B[0]) || cmp(A[1], B[1]);
    });
    var H = [];
    keys.forEach(function (k) {
      var rows = groups[k];
      rows.sort(function (a, b) {
        return cmp(a.t.txn_date, b.t.txn_date) || (ORDER[a.t.txn_type] - ORDER[b.t.txn_type]) || (a.i - b.i);
      });
      var cid = k.split("|")[0], pid = k.split("|")[1], p = plans[pid];
      var lots = [], ev = [], milli = 0, lastSip = null, lastTxn = null, sipAmt = null;
      rows.forEach(function (r) {
        var t = r.t, dn = dayNum(t.txn_date);
        var mu = Math.round(parseFloat(t.units) * 1000);
        lastTxn = dn;
        if (t.txn_type === "REDEEM") {
          var need = -mu;
          for (var j = 0; j < lots.length && need > 0; j++) {
            var L = lots[j], take = Math.min(L.mu, need);
            L.cost = L.mu ? L.cost * (L.mu - take) / L.mu : 0;
            L.mu -= take; need -= take;
          }
          lots = lots.filter(function (L) { return L.mu > 0; });
          milli += mu;
        } else {
          lots.push({ d: dn, mu: mu, cost: parseFloat(t.amount_rs) });
          milli += mu;
          if (t.txn_type === "SIP") { lastSip = dn; sipAmt = parseInt(t.amount_rs, 10); }
        }
        ev.push({ iso: t.txn_date, milli: milli });
      });
      var nNow = NAV[pid + "|" + val], tNow = TER[pid + "|" + val];
      var value = milli * nNow / 1000, fee = value * tNow / 100;
      var invested = 0; lots.forEach(function (L) { invested += L.cost; });
      var paid = 0, e = 0, held = 0;
      feeMonths.forEach(function (m) {
        while (e < ev.length && ev[e].iso <= m) { held = ev[e].milli; e++; }
        var nv = NAV[pid + "|" + m];
        if (held && nv !== undefined) paid += held * nv / 1000 * TER[pid + "|" + m] / 100 / 12;
      });
      var lp = parseFloat(p.exit_load_pct), ld = parseInt(p.exit_load_days, 10);
      var load = 0, freeOn = null, lb = [], lotRows = [];
      lots.forEach(function (L) {
        if (ld > 0 && (valN - L.d) < ld) {
          var lr = L.mu * nNow / 1000 * lp / 100;
          load += lr;
          var fd = L.d + ld;
          lb.push({ mu: L.mu, days: fd - valN });
          lotRows.push({ acquired: isoOf(L.d), free_on: isoOf(fd), units: L.mu / 1000, value_rs: rh(L.mu * nNow / 1000), load_rs: rh(lr), _mu: L.mu });
          if (freeOn === null || fd > freeOn) freeOn = fd;
        }
      });
      var h = { client_id: cid, plan_id: pid, scheme_id: p.scheme_id, plan: p.plan, category: p.category,
        units: milli / 1000, nav_now: nNow, current_value_rs: rh(value), invested_rs: rh(invested),
        ter_now: tNow, annual_fee_rs: rh(fee), fees_paid_since_start_rs: rh(paid),
        exit_load_now_rs: milli > 0 ? rh(load) : 0,
        load_free_date: (freeOn !== null && milli > 0) ? isoOf(freeOn) : null,
        last_txn_date: lastTxn !== null ? isoOf(lastTxn) : null, load_lots: milli > 0 ? lotRows : [],
        last_sip_date: lastSip !== null ? isoOf(lastSip) : null, sip_amount_rs: sipAmt };
      h.gain_rs = h.current_value_rs - h.invested_rs;
      var st;
      if (milli === 0) st = "Redeemed";
      else if (lastSip === null) st = "Lump sum only";
      else {
        var ds = valN - lastSip, dt = valN - lastTxn;
        st = ds <= T.SIP_ACTIVE_DAYS ? "SIP active" : ds <= T.SIP_LAPSE_DAYS ? "SIP lapsed" :
          dt > T.DORMANT_DAYS ? "Dormant" : "SIP stopped";
      }
      h.sip_status = st;
      h.direct_ter_now = null; h.ter_gap_pp = null; h.annual_saving_rs = null;
      h.wait_cost_rs = null; h.cost_10y_regular_rs = null; h.saving_now_rs = null;
      h._save = 0; h._c10 = 0; h._now = 0; h.annual_fee_after_switch_rs = null; h._td = null;
      var verdict;
      if (p.plan === "Direct") verdict = milli > 0 ? "Already Direct" : "Redeemed";
      else if (milli === 0) verdict = "Redeemed";
      else {
        var td = TER[p.scheme_id + "-D|" + val], gap = tNow - td;
        var save = value * gap / 100;
        var c10 = value * (Math.pow(1 + T.ASSUMED_GROSS - td / 100, T.HORIZON_Y) -
                           Math.pow(1 + T.ASSUMED_GROSS - tNow / 100, T.HORIZON_Y));
        h.direct_ter_now = td; h.ter_gap_pp = rh(gap, 2); h.annual_saving_rs = rh(save);
        h.cost_10y_regular_rs = rh(c10); h._save = save; h._c10 = c10;
        h.annual_fee_after_switch_rs = rh(value * td / 100); h._td = td;

    reg.forEach(function (h) { x += "<tr><td><b>" + h.plan_id + "</b><br><span style=\"font-size:12.5px;color:var(--ink2)\">" + esc(sname(h.plan_id)) + "</span></td><td class=\"n\">" + inr(h.current_value_rs) + "</td><td class=\"n\">" + h.ter_now.toFixed(2) + "% &rarr; " + h.direct_ter_now.toFixed(2) + "%</td><td class=\"n\"><b>" + inr(h.annual_saving_rs) + "</b></td><td class=\"n\">" + inr(h.exit_load_now_rs) + '</td><td class="act">' + PILL[h.switch_verdict] + "<br>" + ACT[h.switch_verdict](h) + "</td></tr>"; });
    x += '<tr class="tot"><td>Total</td><td class="n">' + inr(c.regular_value_rs) + '</td><td></td><td class="n">' + inr(c.annual_saving_available_rs) + '</td><td class="n">' + inr(c.exit_load_all_now_rs) + "</td><td></td></tr></tbody></table></div>";
    var withLots = reg.filter(function (h) { return h.load_lots.length; });
    if (withLots.length) {
      xs += '<div class="sched"><h2 style="font-size:17px">When each block of units comes free</h2>';
      withLots.forEach(function (h) { xs += "<p><b>" + h.plan_id + "</b> &nbsp;" + h.load_lots.map(function (l) { return dshort(l.free_on) + " " + inr(l.value_rs); }).join(" &middot; ") + "</p>"; });
      if (reg.some(function (h) { return h.sip_status === "SIP active"; })) xs += "<p>A running SIP in a Regular plan adds new load-bearing units every month. Stop it and register the same SIP in the Direct plan, or this schedule never ends.</p>";
      xs += "</div>";
    }
    xc += '<div class="grid">';
    xc += '<figure class="full"><figcaption><span class="n">Fig ' + (++f) + '</span><span class="t">What staying in Regular costs over ten years</span><span class="d">The gap between today\'s Regular holdings left as they are and the same money switched to Direct, both grown at an <b>assumed 10% a year before fees</b>. An illustration of the fee gap, not a forecast of returns. Hover for both values.</span></figcaption>' + projChart(c.projection_10y) + "</figure>";
    xc += '<figure><figcaption><span class="n">Fig ' + (++f) + '</span><span class="t">What each holding pays a year</span><span class="d">Fee in rupees now and after switching; the label is the saving.</span></figcaption><div class="key"><span><i style="background:' + VI + '"></i>Regular, now</span><span><i style="background:' + EM + '"></i>Direct, after</span></div>' + feeDumbbell(reg) + "</figure>";
    xc += '<figure><figcaption><span class="n">Fig ' + (++f) + '</span><span class="t">The cost of doing it all today</span><span class="d">The full annual saving, less the exit load on units under 365 days old.</span></figcaption>' + waterfall(c) + "</figure>";
    xc += '<figure><figcaption><span class="n">Fig ' + (++f) + '</span><span class="t">Saving unlocked, switching in stages</span><span class="d">Annual saving captured today, then as each block of units comes free of the exit load.</span></figcaption>' + captureChart(c.capture_steps, c.annual_saving_available_rs, o.valuation_date) + "</figure>";
    var vi = vsIndex(hs);
    xc += '<figure><figcaption><span class="n">Fig ' + (++f) + '</span><span class="t">Each fund against its index fund</span><span class="d">Three-year return a year, Direct plans. Filled dot: the fund. Open dot: the index fund. Dashed: behind the index.</span></figcaption>' + (vi || '<p class="sub">None of these schemes has an index comparator (hybrid or index funds).</p>') + "</figure>";
    xc += "</div>";
  }
  if (dir.length) x += '<p class="sub" style="margin-top:16px">Already in Direct, not part of this note: ' + dir.map(function (h) { return h.plan_id; }).join(", ") + ".</p>";
  var flags = [];
  hs.forEach(function (h) {
    var p = P[h.plan_id], d = P[h.scheme_id + "-D"];
    if (h.scheme_fee_verdict === "Not earning its fee") flags.push(h.plan_id + ": over three years the Direct plan returned " + Math.abs(d.excess_3y_pp).toFixed(2) + " percentage points a year less than its index fund (" + d.comparator_scheme_id + ").");
    if (p.fee_flag === "Fee rise") flags.push(h.plan_id + ": its expense ratio rose " + p.ter_change_bps + " basis points in the last twelve months.");
    if (h.sip_status === "Dormant") flags.push(h.plan_id + ": dormant since " + dlong(h.last_sip_date) + " - no SIP and no other transaction.");
  });
  x += '<div class="cols"><div><h2 style="font-size:17px">Noted, not advised on here</h2>' + (flags.length ? '<ul class="l">' + flags.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + '</ul><p style="font-size:13px;color:var(--ink2)">These bear on a different decision - whether to stay in the scheme at all.</p>' : '<p style="font-size:14.5px">Nothing further for this client.</p>') + "</div>";
  x += '<div><h2 style="font-size:17px">Not covered by this note</h2><ul class="l"><li><b>Tax.</b> A switch redeems units; capital gains tax may be due and can outweigh a year of saving.</li><li><b>Suitability</b> of each scheme for the client.</li><li><b>Scheme terms.</b> A 1% / 365-day exit load is assumed for active equity and hybrid schemes; the scheme document governs.</li><li><b>Stamp duty</b> on the new purchase.</li><li><b>Future returns.</b> The saving is a fee difference, not a forecast.</li></ul></div></div>';
  x += '<div class="check"><h3>Adviser\'s copy &middot; check before acting</h3><ul class="l"><li>Both plans\' current TERs confirmed on the AMC website</li><li>Exit-load terms confirmed in each scheme document</li><li>Capital gains estimated for each redemption</li><li>Regular SIPs stopped and Direct SIPs registered</li><li>Client\'s written consent recorded</li></ul></div>';
  x += '<div class="sign"><div>Prepared by (adviser)</div><div>Date</div></div>';
  var hdr = '<p class="eyebrow">' + cid + " &middot; " + esc(c.segment) + " &middot; as at " + dlong(o.valuation_date) + "</p>";
  if (!reg.length) { xc = '<p class="nothing">No charts: ' + cid + " has nothing to switch.</p>"; xs = '<p class="nothing">No release schedule: ' + cid + " has nothing to switch.</p>"; }
  else if (!xs) xs = '<p class="nothing">No units carry an exit load, so everything can move today.</p>';
  var el = document.getElementById("note"); el.innerHTML = x; bindTips(el);
  var ec = document.getElementById("charts"); ec.innerHTML = hdr + "<h1 style=\"font-size:28px\">Charts for " + cid + "</h1>" + xc; bindTips(ec);
  var es = document.getElementById("sched"); es.innerHTML = hdr + "<h1 style=\"font-size:28px\">Release schedule for " + cid + "</h1>" + (reg.length ? releaseChart(reg, o.valuation_date) : "") + xs; bindTips(es);
  renderProv();
}

// ---------- data provenance + loading
function renderProv(msg, bad) {
  var o = R.overview, n = ADDED.txns.length + ADDED.months.length;
  var x = "<b>Where these figures come from.</b> A rule engine inside this page computes every number; it is reconciled field by field against a separate Python implementation. Figures are as at <b>" + dlong(o.valuation_date) + "</b>" + (n ? ", including " + ADDED.months.length + " month-end row(s) and " + ADDED.txns.length + " transaction(s) added in this browser" : "") + ". Demonstration data: every client, scheme and figure is synthetic. The note supports an adviser's recommendation; it is not one by itself.";
  x += '<div class="row noprint"><label for="up">Load a newer month (<code>month_end,plan_id,nav,ter_pct</code>) or transactions (<code>txn_date,client_id,plan_id,txn_type,amount_rs,nav</code>):</label><input type="file" id="up" accept=".csv">' + (n ? '<button class="ghost" id="undo" type="button">Remove what I added</button>' : "") + "</div>";
  if (msg) x += '<div class="msg' + (bad ? " bad" : "") + '">' + esc(msg) + "</div>";
  document.getElementById("prov").innerHTML = x;
  document.getElementById("up").onchange = upload;
  if (n) document.getElementById("undo").onclick = function () { ADDED = { txns: [], months: [] }; save(); refresh(); renderProv("Removed everything you added. Back to the original data, as at " + dlong(R.overview.valuation_date) + "."); };
}
function validDate(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false; var p = s.split("-"), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); return d.getUTCFullYear() === +p[0] && d.getUTCMonth() === +p[1] - 1 && d.getUTCDate() === +p[2]; }
function latest(pid) { var b = null; R._data.monthly.forEach(function (r) { if (r.plan_id === pid && (!b || r.month_end > b.month_end)) b = r; }); return b; }
function addMonth(r) {
  var pid = (r.plan_id || "").trim().toUpperCase();
  if (!validDate(r.month_end)) return "'" + r.month_end + "' is not a valid date";
  var p = r.month_end.split("-"), last = new Date(Date.UTC(+p[0], +p[1], 0)).getUTCDate();
  if (+p[2] !== last) return r.month_end + " is not a month-end";
  if (!PLANS[pid]) return "plan '" + pid + "' does not exist";
  var nav = parseFloat(r.nav); if (!(nav > 0)) return "NAV must be a positive number";
  var ter = (r.ter_pct === undefined || String(r.ter_pct).trim() === "") ? parseFloat(latest(pid).ter_pct) : parseFloat(r.ter_pct);
  if (!(ter >= 0 && ter <= 2.25)) return "TER must be between 0 and 2.25%";
  var row = { month_end: r.month_end, plan_id: pid, nav: nav.toFixed(4), ter_pct: ter.toFixed(2) }, k = r.month_end + "|" + pid, i = -1;
  ADDED.months.forEach(function (a, j) { if (a.month_end + "|" + a.plan_id === k) i = j; });
  if (i >= 0) ADDED.months[i] = row; else ADDED.months.push(row);
  return null;
}
function addTxn(t) {
  var cid = (t.client_id || "").trim().toUpperCase(), pid = (t.plan_id || "").trim().toUpperCase(), ty = (t.txn_type || "").trim().toUpperCase();
  if (!validDate(t.txn_date)) return "'" + t.txn_date + "' is not a valid date";
  if (!CLIENTS[cid]) return "client '" + cid + "' is not on the client list";
  if (!PLANS[pid]) return "plan '" + pid + "' does not exist";
  if (["SIP", "LUMPSUM", "REDEEM"].indexOf(ty) < 0) return "type must be SIP, LUMPSUM or REDEEM";
  var amt = parseFloat(t.amount_rs); if (!(amt > 0)) return "amount must be positive";
  var nav = (t.nav === undefined || String(t.nav).trim() === "") ? parseFloat(latest(pid).nav) : parseFloat(t.nav);
  if (!(nav > 0)) return "NAV must be positive or blank";
  var units = Math.round(amt / nav * 1000) / 1000, key = t.txn_date + "|" + cid + "|" + pid + "|" + ty;
  if (ty === "REDEEM") {
    var held = 0; R._data.txns.forEach(function (x) { if (x.client_id === cid && x.plan_id === pid && (x.txn_date + "|" + x.client_id + "|" + x.plan_id + "|" + x.txn_type) !== key) held += Math.round(parseFloat(x.units) * 1000); });
    if (Math.round(units * 1000) > held) return "redemption exceeds the " + (held / 1000).toFixed(3) + " units held";
    units = -units;
  }
  var row = { txn_date: t.txn_date, client_id: cid, plan_id: pid, txn_type: ty, amount_rs: String(Math.round(amt)), nav: nav.toFixed(4), units: units.toFixed(3) }, i = -1;
  ADDED.txns.forEach(function (a, j) { if ((a.txn_date + "|" + a.client_id + "|" + a.plan_id + "|" + a.txn_type) === key) i = j; });
  if (i >= 0) ADDED.txns[i] = row; else ADDED.txns.push(row);
  return null;
}
function upload(ev) {
  var f = ev.target.files[0]; if (!f) return; var rd = new FileReader();
  rd.onload = function () {
    var text = String(rd.result), head = text.split(/\r?\n/)[0], rows = E.parseCSV(text), isM = /month_end/.test(head), isT = /txn_date/.test(head);
    if (!isM && !isT) { renderProv("Not loaded: the first line must start with month_end,... or txn_date,...", true); return; }
    var before = R.overview.valuation_date, ok = 0, bad = [], bT = 0, bN = 0;
    rows.forEach(function (r, i) {
      if (isM && String(r.ter_pct || "").trim() === "") bT++;
      if (isT && String(r.nav || "").trim() === "") bN++;
      var err = isM ? addMonth(r) : addTxn(r);
      if (err) bad.push("line " + (i + 2) + ": " + err); else { ok++; if (isT) recompute(); }
    });
    save(); refresh();
    var cnt = {}; R._data.monthly.forEach(function (r) { cnt[r.month_end] = (cnt[r.month_end] || 0) + 1; });
    var pend = Object.keys(cnt).filter(function (m) { return m > R.overview.valuation_date; }).map(function (m) { return m + " has " + cnt[m] + " of " + Object.keys(PLANS).length + " plans, so it is stored but not yet used"; });
    renderProv(ok + " line(s) loaded, " + bad.length + " skipped." + (bad.length ? "\n" + bad.slice(0, 12).join("\n") : "") + (bT ? "\n" + bT + " blank TER(s): each plan's latest TER was carried forward." : "") + (bN ? "\n" + bN + " blank NAV(s): the latest month-end NAV on file was used." : "") +
      "\nFigures now as at " + dlong(R.overview.valuation_date) + (R.overview.valuation_date !== before ? " (moved from " + dlong(before) + ")." : " (unchanged).") + (pend.length ? "\n" + pend.join("; ") + "." : ""), bad.length > 0 || ok === 0);
    ev.target.value = "";
  };
  rd.readAsText(f);
}
function fillPicker() {
  var sel = document.getElementById("who"), keep = sel.value;
  var cs = R.clients.slice().sort(function (a, b) { return a.rank_by_saving - b.rank_by_saving; });
  sel.innerHTML = cs.map(function (c) { return '<option value="' + c.client_id + '">' + c.client_id + " · " + esc(c.segment) + " · " + (c.annual_saving_available_rs > 0 ? inr(c.annual_saving_available_rs) + " a year" : "all Direct") + "</option>"; }).join("");
  if (keep) sel.value = keep;
}
function refresh() { recompute(); fillPicker(); renderBook(); renderNote(); document.getElementById("stamp").textContent = (ADDED.txns.length + ADDED.months.length) ? "Demonstration data + your additions" : "Demonstration data"; }
refresh();
document.getElementById("who").onchange = function () { renderNote(); if (CUR === "book") showTab("advice"); };
var CUR = "book";
function showTab(t) {
  CUR = t;
  document.querySelectorAll(".tabs button").forEach(function (b) { var on = b.getAttribute("data-t") === t; b.classList.toggle("on", on); b.setAttribute("aria-selected", on ? "true" : "false"); });
  document.querySelectorAll(".panel").forEach(function (s) { s.classList.toggle("on", s.id === "p-" + t); });
  try { if (location.hash !== "#" + t) history.replaceState(null, "", "#" + t); } catch (e) {}
  window.scrollTo(0, 0);
}
document.querySelectorAll(".tabs button").forEach(function (b) { b.onclick = function () { showTab(b.getAttribute("data-t")); }; });
window.addEventListener("hashchange", function () { var h = location.hash.slice(1); if (["book", "advice", "charts", "schedule"].indexOf(h) >= 0 && h !== CUR) showTab(h); });
showTab(["book", "advice", "charts", "schedule"].indexOf(location.hash.slice(1)) >= 0 ? location.hash.slice(1) : "book");
document.getElementById("print").onclick = function () {
  var framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
  if (framed) { renderProv("Printing is blocked when this page is shown inside another site. Open the page directly (for example the GitHub Pages link) to print or save the note as a PDF.", true); document.getElementById("prov").scrollIntoView(); return; }
  window.print();
};
</script>
